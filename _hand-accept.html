<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
html,body{margin:0;background:#1a2610}
#desk{width:390px;height:520px;position:relative;background:#24150c;margin:0 auto;overflow:hidden}
</style>
</head><body class="phase-booth">
<div id="desk" class="desk"></div>
<script src="desk-v22.js?v=1.28"></script>
<script>
setTimeout(function(){
  var layer=document.getElementById('cb-hand-layer');
  var img=layer && layer.querySelector('img');
  var three=document.getElementById('cb-three');
  document.body.setAttribute('data-result', JSON.stringify({
    accept: !!(img && img.naturalWidth>100 && getComputedStyle(layer).display!=='none'),
    pngHands: document.body.classList.contains('cb-png-hands'),
    ready: !!window.__cbHandsReady,
    src: img && img.src,
    w: img && img.naturalWidth,
    h: img && img.naturalHeight,
    noThree: !three
  }));
}, 800);
</script>
</body></html>
